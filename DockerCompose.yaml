services:
  app:
    container_name: payment-svc
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NAME: "payment-svc"
      PORT: "8888"
      HOST: "database"
      DB_PORT: "5432"
      USER: "postgres"
      PASSWORD: "password_dev"
      DB_NAME: "payments"
      SSL_MODE: "disable"
    ports:
      - "8888:8888"
    depends_on:
      database:
        condition: service_healthy

  database:
    container_name: payment-db
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password_dev"
      POSTGRES_DB: "payments"
      PGDATA: /var/lib/postgresql/data
    ports:
      - "54333:5432"
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  payment_db_data:
